<div class="table-container">
  <table mat-table [dataSource]="dataSource" matSort class="episodes-table">
    
    <!-- Columna: Código de Episodio -->
    <ng-container matColumnDef="episode">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
      <td mat-cell *matCellDef="let episode">
        <span class="episode-badge" [style.backgroundColor]="getSeasonColor(episode.episode)">{{ episode.episode }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let episode" class="episode-name">
        {{ episode.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="air_date">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha de Emisión</th>
      <td mat-cell *matCellDef="let episode">{{ episode.air_date }}</td>
    </ng-container>

    <ng-container matColumnDef="characters">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Personajes</th>
      <td mat-cell *matCellDef="let episode" class="text-center">
        {{ episode.characters.length }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let episode">
        <button 
          mat-icon-button 
          color="primary"
          (click)="onSelectEpisode.emit(episode); $event.stopPropagation()"
          matTooltip="Ver detalles del episodio"
        >
          <mat-icon>visibility</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr 
      mat-row 
      *matRowDef="let row; columns: displayedColumns;"
      class="episode-row"
      (click)="onSelectEpisode.emit(row)"
    ></tr>
  </table>

  <div class="pagination-controls">
    <button 
      mat-raised-button 
      [disabled]="currentPage === 1"
      (click)="previousPage.emit()"
    >
      <mat-icon>chevron_left</mat-icon> Anterior
    </button>
    
    <span class="page-info">
      Página {{ currentPage }} de {{ totalPages }}
    </span>
    
    <button 
      mat-raised-button 
      [disabled]="currentPage === totalPages"
      (click)="nextPage.emit()"
    >
      Siguiente <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>
